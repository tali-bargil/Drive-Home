:root{

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:17px;line-height:1.45}
button{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid var(--fg);outline-offset:3px}

.page{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:24px 48px;display:flex;flex-direction:column;gap:18px}
h1{margin:0;font:600 clamp(1.9rem,5vw,2.6rem)/1.1 var(--font-display);text-wrap:balance}
.sub{margin:6px 0 0;color:var(--muted);max-width:56ch}

.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{padding:0;margin:0 0 6px;font-size:.75rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{position:relative}
.opt input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;cursor:pointer}
.opt label{display:block;padding:9px 16px;border:1.5px solid var(--line);border-radius:999px;background:var(--surface);font-size:.95rem}
.opt input:checked + label{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.opt input:focus-visible + label{outline:3px solid var(--fg);outline-offset:3px}

.hearts{display:flex;align-items:center;gap:6px;min-height:34px}
.hearts[hidden]{display:none}
.hearts .lbl{font-size:.75rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-right:4px}
.heart{width:30px;height:30px;display:block}
.heart path{fill:var(--heart);stroke:var(--heart);stroke-width:2;stroke-linejoin:round}
.heart.lost path{fill:none;stroke:var(--muted)}
.heart.pulse{animation:beat .5s}
@keyframes beat{0%{transform:scale(1)}40%{transform:scale(.7) rotate(-8deg)}100%{transform:scale(1)}}

.scene{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column}
.status{margin:0;padding:14px 18px 10px;display:flex;justify-content:space-between;align-items:baseline;gap:4px 12px;font:600 1.15rem var(--font-display);flex-wrap:wrap}
.status span:last-child{color:var(--muted);font:400 .9rem var(--font-body)}

.mapwrap{background:var(--grass);line-height:0}
#map{display:block;width:100%;max-width:640px;height:auto;margin-inline:auto}
.f-grass{fill:var(--grass)} .f-grass2{fill:var(--grass2)}
.f-tree{fill:var(--tree)} .f-tree2{fill:var(--tree2)} .f-trunk{fill:var(--trunk)}
.f-water{fill:var(--water)} .f-water2{fill:var(--water2)}
.f-cloud{fill:var(--cloud)}
.s-edge{stroke:var(--edge)} .s-road{stroke:var(--road)} .s-lane{stroke:var(--lane)}
.lbl{font:600 15px var(--font-display);fill:var(--fg);paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}
.badge circle.b{fill:var(--surface);stroke:var(--fg);stroke-width:2.5}
.badge text{font:600 15px var(--font-display);fill:var(--fg);text-anchor:middle;dominant-baseline:central}
.badge.done circle.b{fill:var(--good);stroke:var(--good)}
.badge.done text{fill:#fff}
.badge .glow{fill:none;stroke:var(--accent);stroke-width:4;opacity:0}
.badge.now .glow{opacity:1}
.badge.now circle.b{stroke:var(--accent)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .badge.done text{color:#0E1520;fill:#0E1520}}
:root[data-theme="dark"] .badge.done text{fill:#0E1520}
.puff{animation:puff 3.2s ease-out infinite;transform-box:fill-box;transform-origin:center}
.puff.p2{animation-delay:1.6s}
@keyframes puff{0%{transform:translate(0,0) scale(.5);opacity:.9}100%{transform:translate(10px,-26px) scale(1.4);opacity:0}}
.cloud{animation:drift 38s ease-in-out infinite alternate}
.cloud.c2{animation-duration:52s;animation-delay:-14s}
.cloud.c3{animation-duration:44s;animation-delay:-28s}
@keyframes drift{from{transform:translateX(-26px)}to{transform:translateX(34px)}}

.controls{padding:14px 18px 20px;display:flex;flex-direction:column;align-items:center;gap:10px}
.msg{margin:0;text-align:center;min-height:1.5em}
.go{display:inline-flex;align-items:center;gap:14px;font:600 1.35rem/1 var(--font-display);padding:12px 14px 12px 28px;border-radius:999px;border:0;background:var(--accent);color:var(--accent-fg);cursor:pointer;min-height:64px}
.go svg{width:42px;height:42px;flex:0 0 auto;background:var(--accent-fg);border-radius:50%;padding:8px}
.go svg path{stroke:var(--accent);fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.go:hover:not(:disabled){filter:brightness(1.06)}
.go:disabled{opacity:.5;cursor:not-allowed}
.go[hidden]{display:none}
.go.nudge svg{animation:nudge 1s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}

/* card */
.overlay{position:fixed;inset:0;background:var(--backdrop);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20;overflow:auto}
.overlay[hidden]{display:none}
.card{background:var(--surface);border-radius:22px;padding:24px;width:min(100%,560px);display:flex;flex-direction:column;gap:16px;box-shadow:0 20px 60px rgba(0,0,0,.35);animation:rise .28s ease-out}
.card.closing{animation:fall .2s ease-in forwards}
@keyframes rise{from{transform:translateY(24px) scale(.96);opacity:0}to{transform:none;opacity:1}}
@keyframes fall{to{transform:translateY(16px) scale(.96);opacity:0}}
.eyebrow{margin:0;font-size:.78rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.card h2{margin:0;font:600 1.5rem/1.2 var(--font-display);text-wrap:balance}
.card .hint{margin:-8px 0 0;color:var(--muted);font-size:.95rem}
.options{display:flex;flex-direction:column;gap:10px}
.option{font:700 1.2rem/1.3 var(--font-body);padding:16px 18px;border-radius:14px;border:2px solid var(--line);background:var(--surface-2);cursor:pointer;text-align:left;min-height:60px;display:flex;align-items:center;gap:12px}
.option:hover:not(:disabled){border-color:var(--fg)}
.option .mk{flex:0 0 auto;width:1.5em;text-align:center;font-weight:700}
.option .mk:empty{display:none}
.option.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.option.wrong{opacity:.55;text-decoration:line-through;background:var(--bad-bg);border-color:var(--bad)}
.option.right{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.option:disabled{cursor:default}
.card .note{margin:0;font-weight:700;min-height:1.4em}
.card .note.bad{color:var(--bad)}
.card .note.good{color:var(--good)}
.btn{font:600 1.2rem/1.1 var(--font-display);padding:16px 30px;border-radius:16px;border:2px solid var(--line);background:var(--surface);cursor:pointer;min-height:56px;align-self:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.big{text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.big p{margin:0;color:var(--muted)}

canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}

@media (prefers-reduced-motion: reduce){
  *{animation:none !important;transition:none !important}
}
</style>

<main class="page">
  <header>
    <h1>Drive Home</h1>
    <p class="sub">Drive from the supermarket to your house. At every stop, press the sentence that is correct. Then press the arrow button, or the space bar, to drive on.</p>
  </header>

  <div class="bar">
    <fieldset>
      <legend>Game</legend>
      <div class="opts">
        <span class="opt"><input type="radio" id="m-easy" name="mode" value="easy" checked><label for="m-easy">Simple</label></span>
        <span class="opt"><input type="radio" id="m-hard" name="mode" value="hard"><label for="m-hard">Challenge, 3 lives</label></span>
      </div>
    </fieldset>
    <div class="hearts" id="hearts" role="img" aria-label="" hidden></div>
  </div>

  <section class="scene" aria-label="The road home" id="scene">
    <p class="status"><span id="stopLabel">At the supermarket</span><span id="modeLabel"></span></p>
    <div class="mapwrap">
      <svg id="map" viewBox="0 -60 600 840" role="img" aria-label="A winding road from the supermarket to home with ten stops along the way">
        <path id="route" d="M50,110 C150,60 230,170 320,120 C400,75 480,70 540,110 C590,140 590,215 530,240 C450,275 380,200 290,245 C200,290 130,290 70,320 C20,345 20,420 80,445 C160,480 230,400 320,440 C410,480 470,470 530,520 C585,555 585,630 520,655 C440,690 360,620 270,660 C200,695 140,690 100,700" fill="none" stroke="none"/>
        <g id="layer"></g>
      </svg>
    </div>
    <div class="controls">
      <p class="msg" id="msg" role="status" aria-live="polite"></p>
      <button type="button" class="go nudge" id="goBtn"><span id="goLabel">Start driving</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6"/></svg>
      </button>
    </div>
  </section>
</main>

<div class="overlay" id="overlay" hidden>
  <div class="card" id="card" role="dialog" aria-modal="true" aria-labelledby="cardTitle"></div>
</div>

  /* ---------- car movement ---------- */
  function setCar(len, back){
    var p = route.getPointAtLength(len);
    var t = tangentAt(len);
    var a = Math.atan2(t.y, t.x) * 180 / Math.PI;
    if (back) a += 180;
    var flip = Math.cos(a * Math.PI / 180) < 0 ? -1 : 1;
    carEl.setAttribute('transform', 'translate(' + p.x.toFixed(1) + ' ' + p.y.toFixed(1) + ') rotate(' + a.toFixed(1) + ') scale(1 ' + flip + ')');
    S.len = len;
  }

  function animate(to, back, done){
    var from = S.len, g = S.gen, t0 = null;
    var ms = Math.max(600, Math.abs(to - from) * 4.2);
    S.busy = true;
    if (reduce) { setCar(to, back); S.busy = false; done(); return; }
    function step(ts){
      if (g !== S.gen) return;
      if (t0 === null) t0 = ts;
      var t = Math.min(1, (ts - t0) / ms);
      var e = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
      setCar(from + (to - from) * e, back);
      if (t < 1) requestAnimationFrame(step); else { S.busy = false; done(); }
    }
    requestAnimationFrame(step);
  }

  }

  function paintHearts(lostIndex){
    var box = $('hearts');
    var on = S.mode === 'hard';
    box.hidden = !on;
    if (!on) return;
    box.setAttribute('aria-label', S.lives + ' of ' + LIVES + ' lives left');
    var html = '<span class="lbl">Lives</span>';
    for (var i = 0; i < LIVES; i++) {
      var lost = i >= S.lives;
      html += '<svg class="heart' + (lost ? ' lost' : '') + (i === lostIndex ? ' pulse' : '') + '" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 28 C4 19 3 12 6 8.500 C9 5 14 6 16 10 C18 6 23 5 26 8.500 C29 12 28 19 16 28 Z"/></svg>';
    }
    box.innerHTML = html;
  }

  function setLabel(t){ $('stopLabel').textContent = t; }
  function setMsg(t){ $('msg').textContent = t || ''; }
  function setGo(label, disabled, hidden){
    $('goLabel').textContent = label;
    var b = $('goBtn');
    b.disabled = !!disabled;
    b.hidden = !!hidden;
  }

  function readyForNext(){
    var label = S.k === 0 ? (S.best > 0 || S.lives < LIVES ? 'Drive again' : 'Start driving') : (S.k === STOPS ? 'Drive home' : 'Next stop');
    setGo(label, false, false);
  }

  function showMap(){
    try { $('scene').scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'nearest' }); } catch (e) {}
    try { $('goBtn').focus({ preventScroll:true }); } catch (e) {}
  }

  /* ---------- game flow ---------- */
  function newGame(){
    S.gen++;
    S.deck = pickDeck();
    S.k = 0; S.done = {}; S.lives = LIVES; S.best = 0; S.busy = false;
    closeOverlay(true);
    setCar(0, false);
    paintBadges();
    paintHearts(-1);
    $('modeLabel').textContent = S.mode === 'hard' ? 'Challenge: a wrong answer sends you back to the start' : 'Simple: try again until you get it right';
    setLabel('At the supermarket');
    setMsg('Press the arrow button or the space bar to start driving.');
    readyForNext();
  }

  function goNext(){
    if (S.busy) return;
    var to = S.k + 1;
    setMsg('');
    setGo('Driving…', true, false);
    animate(to > STOPS ? L : stopLen(to), false, function(){
      S.k = to;
      if (S.k > STOPS) { win(); return; }
      paintBadges();
      setLabel('Stop ' + S.k + ' of ' + STOPS + ': ' + NAMES[S.k - 1]);
      setGo('Driving…', true, true);
      openCard();
    });
  }

  function openCard(){
    var pair = S.deck[S.k - 1];
    S.opts = shuffle([{ t:pair[0], ok:true }, { t:pair[1], ok:false }]);
    var html = '<p class="eyebrow">Stop ' + S.k + ' of ' + STOPS + ' · ' + NAMES[S.k - 1] + '</p>' +
      '<h2 id="cardTitle">Which sentence is correct?</h2>' +
      '<p class="hint">' + (S.mode === 'hard' ? 'Careful. A wrong answer sends you back to the start.' : 'Press the correct sentence.') + '</p>' +
      '<div class="options">' + S.opts.map(function(o, i){
        return '<button type="button" class="option" data-i="' + i + '"><span class="mk" aria-hidden="true"></span><span>' + o.t + '</span></button>';
      }).join('') + '</div><p class="note" id="note" role="status" aria-live="polite"></p>';
    showOverlay(html);
    var first = $('card').querySelector('.option');
    if (first) { try { first.focus({ preventScroll:true }); } catch (e) {} }
  }

  function showOverlay(html){
    var c = $('card');
    c.classList.remove('closing');
    c.innerHTML = html;
    $('overlay').hidden = false;
  }

  function closeOverlay(immediate, cb){
    var ov = $('overlay'), c = $('card');
    if (ov.hidden) { if (cb) cb(); return; }
    if (immediate || reduce) { ov.hidden = true; c.classList.remove('closing'); if (cb) cb(); return; }
    c.classList.add('closing');
    setTimeout(function(){ ov.hidden = true; c.classList.remove('closing'); if (cb) cb(); }, 210);
  }

  function lockOptions(){
    Array.prototype.forEach.call($('card').querySelectorAll('.option'), function(b){ b.disabled = true; });
  }

  function onPick(i){
    var o = S.opts[i];
    var btns = $('card').querySelectorAll('.option');
    var btn = btns[i];
    var note = $('note');
    if (o.ok) {
      btn.classList.add('right');
      btn.querySelector('.mk').textContent = '✓';
      lockOptions();
      note.className = 'note good';
      note.textContent = 'Correct!';
      cheer(false);
      var g = S.gen;
      setTimeout(function(){
        if (g !== S.gen) return;
        closeOverlay(false, function(){
          if (g !== S.gen) return;
          S.done[S.k] = true;
          S.best = Math.max(S.best, S.k);
          paintBadges();
          setLabel('Stop ' + S.k + ' of ' + STOPS + ' done');
          setMsg(S.k === STOPS ? 'Great! Press the arrow or the space bar to drive home.' : 'Great! Press the arrow or the space bar to drive to the next stop.');
          readyForNext();
          showMap();
        });
      }, reduce ? 600 : 850);
      return;
    }
    if (S.mode === 'easy') {
      btn.classList.add('wrong', 'shake');
      btn.querySelector('.mk').textContent = '✗';
      btn.disabled = true;
      note.className = 'note bad';
      note.textContent = 'Not quite. Try the other one.';
      return;
    }
    // challenge: wrong answer
    var lostIdx = S.lives - 1;
    S.lives--;
    paintHearts(lostIdx);
    S.opts.forEach(function(opt, j){
      var b = btns[j];
      b.disabled = true;
      if (opt.ok) { b.classList.add('right'); b.querySelector('.mk').textContent = '✓'; }
      else { b.classList.add('wrong'); b.querySelector('.mk').textContent = '✗'; }
    });
    note.className = 'note bad';
    note.textContent = S.lives > 0 ? 'Oops! The green one is correct. Back to the start. Lives left: ' + S.lives + '.' : 'Oops! The green one is correct. You have no lives left.';
    var b2 = document.createElement('button');
    b2.type = 'button';
    b2.className = 'btn primary';
    b2.id = 'afterWrong';
    b2.textContent = S.lives > 0 ? 'Back to the start' : 'See my result';
    $('card').appendChild(b2);
    try { b2.focus({ preventScroll:true }); } catch (e) {}
  }

  function afterWrong(){
    var g = S.gen;
    var reached = 0;
    for (var i = 1; i <= STOPS; i++) if (S.done[i]) reached = i;
    S.best = Math.max(S.best, reached);
    closeOverlay(false, function(){
      if (g !== S.gen) return;
      if (S.lives <= 0) { gameOver(); return; }
      S.k = 0; S.done = {};
      paintBadges();
      setLabel('Driving back to the supermarket');
      setGo('Driving…', true, false);
      animate(0, true, function(){
        if (g !== S.gen) return;
        setCar(0, false);
        setLabel('At the supermarket');
        setMsg('Back at the start. Press the arrow to try again.');
        readyForNext();
        showMap();
      });
    });
  }

  function gameOver(){
    setGo('Play again', false, false);
    setMsg('');
    setLabel('Out of lives');
    var n = S.best;
    showOverlay('<div class="big"><h2 id="cardTitle">Game over</h2><p>' +
      (n > 0 ? 'You got ' + n + ' stop' + (n === 1 ? '' : 's') + ' right in a row. Great try!' : 'Good try! Ready for another go?') +
      '</p><button type="button" class="btn primary" id="again">Play again</button></div>');
    try { $('again').focus({ preventScroll:true }); } catch (e) {}
  }

  function win(){
    paintBadges();
    setGo('Play again', false, false);
    setMsg('You made it home!');
    setLabel('You are home!');
    cheer(true);
    var extra = S.mode === 'hard' ? '<p>Lives left: ' + S.lives + ' of ' + LIVES + '.</p>' : '';
    showOverlay('<div class="big"><h2 id="cardTitle">You are home!</h2><p>All ' + STOPS + ' stops done.</p>' + extra +
      '<button type="button" class="btn primary" id="again">Play again</button></div>');
    try { $('again').focus({ preventScroll:true }); } catch (e) {}
  }

  /* ---------- events ---------- */
  $('card').addEventListener('click', function(e){
    var t = e.target.closest ? e.target.closest('button') : null;
    if (!t) return;
    if (t.id === 'again') { newGame(); return; }
    if (t.id === 'afterWrong') { afterWrong(); return; }
    if (t.classList.contains('option') && !t.disabled) onPick(+t.dataset.i);
  });

  $('goBtn').addEventListener('click', function(){
    if (S.k > STOPS || (S.mode === 'hard' && S.lives <= 0)) { newGame(); return; }
    if ($('goLabel').textContent === 'Play again') { newGame(); return; }
    goNext();
  });

  document.addEventListener('keydown', function(e){
    if (e.code !== 'Space' && e.key !== ' ') return;
    var tg = e.target;
    if (tg && tg !== document.body && tg !== document.documentElement) return;   // a focused button handles its own space press
    var b = $('goBtn');
    if (!$('overlay').hidden || b.disabled || b.hidden) return;
    e.preventDefault();
    b.click();
  });

  Array.prototype.forEach.call(document.querySelectorAll('input[name="mode"]'), function(el){
    el.addEventListener('change', function(){ S.mode = el.value; newGame(); try { $('goBtn').focus({ preventScroll:true }); } catch (e) {} });
  });

  window.addEventListener('resize', sizeCanvas);
  sizeCanvas();
  buildScene();
  newGame();
})();
</script>

</body></html>
